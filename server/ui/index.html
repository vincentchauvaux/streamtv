<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <title>Connexion — StreamTV</title>
  <link rel="stylesheet" href="/ui/app.css?v=5">
</head>
<body class="bg-mesh login-page">
  <main class="login-shell">
    <div class="brand login-brand">
      <span class="logo" aria-hidden="true">▶</span>
      <strong class="gradient">StreamTV</strong>
    </div>
    <form id="login-form" class="card login-card" method="post" action="/api/auth/login" autocomplete="on">
      <h1>Connexion</h1>
      <p class="muted login-lead">Accès réservé. Identifiez-vous pour continuer.</p>
      <label>Email
        <input name="email" type="email" autocomplete="username" required maxlength="254" inputmode="email" spellcheck="false">
      </label>
      <label>Mot de passe
        <input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
      </label>
      <p class="err" id="login-err" hidden role="alert"></p>
      <button type="submit" class="btn primary" id="login-btn">Entrer</button>
    </form>
  </main>
  <script src="/ui/landing.js?v=5" defer></script>
</body>
</html>
